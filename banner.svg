<g transform="translate(10 10) scale(1.65) translate(0, 0)"><path fill="#3776AB" d="M12.001 0c-5.795 0-9.255 2.502-9.255 7.155v2.791h9.458v1.332H3.774C1.564 11.278 0 12.981 0 15.654c0 2.671 1.637 4.417 4.195 4.945h2.152v-3.053c0-2.617 2.148-4.757 4.773-4.757h5.088c1.378 0 2.493-1.11 2.493-2.482v-6.38C18.701 1.776 16.033 0 12.001 0zM8.98 2.894a1.276 1.276 0 1 1 0 2.553 1.276 1.276 0 0 1 0-2.553zM19.805 9.055h-2.151v3.054c0 2.618-2.149 4.757-4.774 4.757h-5.087c-1.379 0-2.493 1.111-2.493 2.483v6.379c0 2.152 2.668 3.927 6.7 3.927 5.795 0 9.254-2.501 9.254-7.155v-2.79H11.795V18.38h8.43c2.21 0 3.774-1.703 3.774-4.376 0-2.671-1.637-4.417-4.194-4.945zm-7.824 15.498a1.276 1.276 0 1 1 0-2.553 1.276 1.276 0 0 1 0 2.553z"/></g>
