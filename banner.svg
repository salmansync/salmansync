<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8" /><stop offset=".5" stop-color="#818cf8" /><stop offset="1" stop-color="#a855f7" /></linearGradient>
<linearGradient id="winBorder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".7" /><stop offset=".5" stop-color="#1e293b" stop-opacity=".9" /><stop offset="1" stop-color="#818cf8" stop-opacity=".7" /></linearGradient>
<linearGradient id="nameGrad"><stop offset="0" stop-color="#38bdf8" /><stop offset=".4" stop-color="#a5b4fc" /><stop offset="1" stop-color="#f472b6" /></linearGradient>
<linearGradient id="beam"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0" /><stop offset=".5" stop-color="#7dd3fc" stop-opacity=".08" /><stop offset="1" stop-color="#7dd3fc" stop-opacity="0" /></linearGradient>
