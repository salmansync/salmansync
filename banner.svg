<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="Md. Salman Farsi, Full-Stack Web Developer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0310" /><stop offset=".5" stop-color="#190933" /><stop offset="1" stop-color="#2d134b" /></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc" /><stop offset=".5" stop-color="#818cf8" /><stop offset="1" stop-color="#38bdf8" /></linearGradient>
<linearGradient id="winBorder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c084fc" stop-opacity=".7" /><stop offset=".5" stop-color="#2d134b" stop-opacity=".9" /><stop offset="1" stop-color="#38bdf8" stop-opacity=".7" /></linearGradient>
<!-- Professional White/Silver Gradient for Name -->
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" /><stop offset="0.7" stop-color="#f1f5f9" /><stop offset="1" stop-color="#cbd5e1" /></linearGradient>
<linearGradient id="beam"><stop offset="0" stop-color="#c084fc" stop-opacity="0" /><stop offset=".5" stop-color="#c084fc" stop-opacity=".1" /><stop offset="1" stop-color="#c084fc" stop-opacity="0" /></linearGradient>
<radialGradient id="spot"><stop offset="0" stop-color="#a855f7" stop-opacity=".2" /><stop offset="1" stop-color="#a855f7" stop-opacity="0" /></radialGradient>
<radialGradient id="orbBlue"><stop offset="0" stop-color="#e879f9" stop-opacity=".2" /><stop offset="1" stop-color="#e879f9" stop-opacity="0" /></radialGradient>
<radialGradient id="orbIndigo"><stop offset="0" stop-color="#818cf8" stop-opacity=".25" /><stop offset="1" stop-color="#818cf8" stop-opacity="0" /></radialGradient>

<!-- Floating Programming Symbols Paths -->
<path id="s-code" d="M10 8L4 14l6 6M18 8l6 6-6 6M15 6l-4 16"/>
<path id="s-brace" d="M12 4C8 4 9 8 9 11c0 2-2 3-4 3 2 0 4 1 4 3 0 3-1 7 3 7M16 4c4 0 3 4 3 7 0 2 2 3 4 3-2 0-4 1-4 3 0 3 1 7-3 7"/>
<path id="s-bracket" d="M11 4H6v20h5M17 4h5v20h-5"/>
<path id="s-slash" d="M11 22L16 6M19 22l5-16"/>

<style>
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:Consolas,'SF Mono',Menlo,'Courier New',monospace}
.eyebrow{font-size:11.5px;font-weight:700;fill:#c084fc;letter-spacing:4.5px}
/* Professional System Font Stack for the Name */
.name{font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size:48px; font-weight:700; fill:url(#nameGrad); letter-spacing:-0.5px;}
.role{font-size:14px;font-weight:700;fill:#94a3b8;letter-spacing:3.5px}
.code{font-size:14.5px;fill:#cbd5e1}
.ln{font-size:13px;fill:#64748b}
.kw{fill:#f472b6}.pr{fill:#38bdf8}.st{fill:#34d399}.pn{fill:#a78bfa}
.cd{fill:#0b0515;stroke:var(--c);stroke-opacity:.4;stroke-width:1.5}
.ct{fill:var(--c);opacity:.07}
.lt{font-size:20px;font-weight:900;text-anchor:middle}
.in{opacity:0;animation:rise .8s ease-out forwards}

/* Background Animations */
.blob1{animation:drift 12s ease-in-out infinite alternate}
.blob2{animation:drift 15s ease-in-out infinite alternate-reverse}
.wave1{animation:sway 12s ease-in-out infinite alternate}
.wave2{animation:sway 16s ease-in-out infinite alternate-reverse}
.breath{animation:breath 5s ease-in-out infinite alternate}
.cursor{animation:blink 1.2s steps(1) infinite}
.bar,.eline{transform-box:fill-box;transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}

/* Floating Symbols CSS */
.gl{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.15}
.a{stroke:#c084fc}.b{stroke:#38bdf8}
.fr,.fl,.fu{animation:flow var(--d) var(--t) linear infinite}
.fr{--x:1320px;--y:0px}.fl{--x:-1320px;--y:0px}.fu{--x:0px;--y:-860px}

/* Logo Border Animation CSS */
.icon-border {
  fill: none;
  stroke-width: 2px;
  animation: pulseBorder 1.5s infinite alternate ease-in-out;
}
.ib-1 { animation-delay: 0s; stroke: #F7DF1E; }
.ib-2 { animation-delay: 0.2s; stroke: #3178C6; }
.ib-3 { animation-delay: 0.4s; stroke: #61DAFB; }
.ib-4 { animation-delay: 0.6s; stroke: #FFFFFF; }
.ib-5 { animation-delay: 0.8s; stroke: #339933; }
.ib-6 { animation-delay: 1.0s; stroke: #FFD43B; }
.ib-7 { animation-delay: 1.2s; stroke: #47A248; }

@keyframes pulseBorder {
  0% { stroke-opacity: 0.2; stroke-width: 1.5px; }
  100% { stroke-opacity: 1; stroke-width: 3.5px; }
}
@keyframes rise{to{opacity:1}}
@keyframes drift{from{transform:translate(-20px,0)}to{transform:translate(20px,10px)}}
@keyframes sway{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes breath{from{opacity:.45}to{opacity:.85}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{0%{transform:translate(0,0);opacity:0}8%,92%{opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
</style>
</defs>

<rect width="1200" height="400" fill="url(#bg)" />
<polygon points="260,0 360,0 140,400 40,400" fill="url(#beam)" />
<polygon points="560,0 610,0 450,400 400,400" fill="url(#beam)" />
<circle cx="890" cy="190" r="300" fill="url(#spot)" />
<circle class="blob1" cx="1020" cy="50" r="180" fill="url(#orbBlue)" />
<circle class="blob2" cx="210" cy="350" r="180" fill="url(#orbIndigo)" />
<path class="wave1" d="M-80 345C150 305 350 385 600 345S1050 305 1280 345V400H-80z" fill="#a855f7" opacity=".08" />
<path class="wave2" d="M-80 368C200 335 400 395 650 365S1000 340 1280 368V400H-80z" fill="#38bdf8" opacity=".08" />

<!-- Floating Symbols Elements -->
<g class="gl" transform="scale(1.5) translate(0, -30)">
<use href="#s-code" class="fr a" x="-50" y="40" style="--d:46s;--t:-5s"/>
<use href="#s-brace" class="fr b" x="-50" y="110" style="--d:55s;--t:-24s"/>
<use href="#s-slash" class="fr a" x="-50" y="190" style="--d:60s;--t:-41s"/>
<use href="#s-bracket" class="fl b" x="850" y="60" style="--d:50s;--t:-8s"/>
<use href="#s-code" class="fl a" x="850" y="150" style="--d:58s;--t:-30s"/>
<use href="#s-brace" class="fl b" x="850" y="240" style="--d:64s;--t:-18s"/>
<use href="#s-bracket" class="fu a" x="350" y="380" style="--d:40s;--t:-9s"/>
<use href="#s-slash" class="fu b" x="550" y="380" style="--d:46s;--t:-28s"/>
<use href="#s-code" class="fu a" x="750" y="380" style="--d:52s;--t:-42s"/>
</g>

<g class="in" style="animation-delay:.1s">
<rect class="eline" x="70" y="75" width="28" height="2" rx="1" fill="url(#accent)" style="animation-delay:.1s" />
<text class="sans eyebrow" x="110" y="80">WEB DEVELOPMENT &#183; AI DRIVEN</text>
</g>
<text class="name in" x="68" y="136" style="animation-delay:.2s">Md. Salman Farsi</text>
<rect class="bar" x="70" y="154" width="90" height="4.5" rx="2" fill="url(#accent)" style="animation-delay:.4s" />
<text class="sans role in" x="70" y="196" style="animation-delay:.5s">FULL-STACK DEVELOPER &amp; CONTENT CREATOR</text>

<!-- Professional Skillicons-style Badges with Animated Borders -->
<!-- 1. JS -->
<g class="in" transform="translate(70 244)" style="animation-delay:.6s">
<rect x="-3" y="-3" width="50" height="50" rx="13" class="icon-border ib-1" />
<rect x="0" y="0" width="44" height="44" rx="10" fill="#F7DF1E" />
<text class="sans lt" x="22" y="30" fill="#000">JS</text>
</g>

<!-- 2. TS -->
<g class="in" transform="translate(135 244)" style="animation-delay:.7s">
<rect x="-3" y="-3" width="50" height="50" rx="13" class="icon-border ib-2" />
<rect x="0" y="0" width="44" height="44" rx="10" fill="#3178C6" />
<text class="sans lt" x="22" y="30" fill="#fff">TS</text>
</g>

<!-- 3. React -->
<g class="in" transform="translate(200 244)" style="animation-delay:.8s">
<rect x="-3" y="-3" width="50" height="50" rx="13" class="icon-border ib-3" />
<rect x="0" y="0" width="44" height="44" rx="10" fill="#242938" />
<g fill="none" stroke="#61DAFB" stroke-width="1.8" transform="translate(22 22)">
  <ellipse rx="12" ry="4.5" /><ellipse rx="12" ry="4.5" transform="rotate(60)" /><ellipse rx="12" ry="4.5" transform="rotate(120)" />
  <circle r="2.2" fill="#61DAFB" stroke="none" />
</g>
</g>

<!-- 4. Next.js -->
<g class="in" transform="translate(265 244)" style="animation-delay:.9s">
<rect x="-3" y="-3" width="50" height="50" rx="13" class="icon-border ib-4" />
<rect x="0" y="0" width="44" height="44" rx="10" fill="#fff" />
<text class="sans lt" x="22" y="30" fill="#000">N</text>
</g>

<!-- 5. Node.js -->
<g class="in" transform="translate(330 244)" style="animation-delay:1s">
<rect x="-3" y="-3" width="50" height="50" rx="13" class="icon-border ib-5" />
<rect x="0" y="0" width="44" height="44" rx="10" fill="#242938" />
<g transform="translate(22 22)">
  <path d="M0 -11.5 L10 -5.5 v11 L0 11.5 L-10 5.5 v-11 z" fill="none" stroke="#339933" stroke-width="2" stroke-linejoin="round"/>
  <path d="M0 -6 L-5.5 -3 v6 L0 6 L5.5 3 v-6 z" fill="#339933" />
</g>
</g>

<!-- 6. Python -->
<g class="in" transform="translate(395 244)" style="animation-delay:1.1s">
<rect x="-3" y="-3" width="50" height="50" rx="13" class="icon-border ib-6" />
<rect x="0" y="0" width="44" height="44" rx="10" fill="#242938" />
<g transform="scale(0.88)">
  <path fill="#3776AB" d="M24.7 11.2c-4.4 0-7 .2-7 5.4v2.1h7v1h-8c-1.9.3-2.9 1.6-2.9 3.6 0 2 1.3 3.3 3.2 3.7h1.6v-2.3c0-2 1.6-3.6 3.6-3.6h3.8c1 0 1.8-.8 1.8-1.8v-4.8c0-1.7-1.8-3.3-3.2-3.3zm-2.2 2.2a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
  <path fill="#FFD43B" d="M25.3 38.8c4.4 0 7-.2 7-5.4v-2.1h-7v-1h8c1.9-.3 2.9-1.6 2.9-3.6 0-2-1.3-3.3-3.2-3.7h-1.6v2.3c0 2-1.6 3.6-3.6 3.6h-3.8c-1 0-1.8.8-1.8 1.8v4.8c0 1.7 1.8 3.3 3.2 3.3zm2.2-2.2a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" />
</g>
</g>

<!-- 7. MongoDB -->
<g class="in" transform="translate(460 244)" style="animation-delay:1.2s">
<rect x="-3" y="-3" width="50" height="50" rx="13" class="icon-border ib-7" />
<rect x="0" y="0" width="44" height="44" rx="10" fill="#242938" />
<path fill="#47A248" d="M22 6c0 0-8 6-8 16s4 14 8 17c4-3 8-7 8-17s-8-16-8-16z"/>
</g>

<!-- Editor Window -->
<ellipse class="breath" cx="890" cy="190" rx="270" ry="180" fill="url(#spot)" />
<g class="in" style="animation-delay:.4s">
<rect x="670" y="60" width="450" height="265" rx="16" fill="#0a0515" stroke="url(#winBorder)" stroke-width="1.5" />
<path d="M670 76a16 16 0 0 1 16-16h418a16 16 0 0 1 16 16v22H670z" fill="#140a28" />
<circle cx="696" cy="79" r="6" fill="#f87171" />
<circle cx="718" cy="79" r="6" fill="#fbbf24" />
<circle cx="740" cy="79" r="6" fill="#34d399" />
<text class="mono" x="895" y="84" font-size="13" fill="#94a3b8" text-anchor="middle">engineer.ts</text>
<rect x="671" y="271" width="448" height="26" fill="#c084fc" opacity=".1" />
<rect x="671" y="271" width="3.5" height="26" fill="#c084fc" />
<g class="mono ln">
<text x="688" y="128">1</text><text x="688" y="152">2</text><text x="688" y="176">3</text>
<text x="688" y="200">4</text><text x="688" y="224">5</text><text x="688" y="248">6</text><text x="688" y="272">7</text><text x="688" y="296">8</text>
</g>
<g class="mono code" xml:space="preserve">
<text x="715" y="128" class="in" style="animation-delay:.7s"><tspan class="kw">const</tspan> <tspan class="pr">developer</tspan> <tspan class="pn"> = {</tspan></text>
<text x="715" y="152" class="in" style="animation-delay:.9s">  <tspan class="pr">name</tspan><tspan class="pn">:</tspan> <tspan class="st">"Md. Salman Farsi"</tspan><tspan class="pn">,</tspan></text>
<text x="715" y="176" class="in" style="animation-delay:1.1s">  <tspan class="pr">focus</tspan><tspan class="pn">:</tspan> <tspan class="st">"Full-Stack Web Development"</tspan><tspan class="pn">,</tspan></text>
<text x="715" y="200" class="in" style="animation-delay:1.3s">  <tspan class="pr">stack</tspan><tspan class="pn">: [</tspan><tspan class="st">"React"</tspan><tspan class="pn">,</tspan> <tspan class="st">"Node.js"</tspan><tspan class="pn">,</tspan> <tspan class="st">"Python"</tspan><tspan class="pn">,</tspan> <tspan class="st">"Java"</tspan><tspan class="pn">],</tspan></text>
<text x="715" y="224" class="in" style="animation-delay:1.5s">  <tspan class="pr">education</tspan><tspan class="pn">:</tspan> <tspan class="st">"Govt. Graphic Arts Institute"</tspan><tspan class="pn">,</tspan></text>
<text x="715" y="248" class="in" style="animation-delay:1.7s">  <tspan class="pr">intern</tspan><tspan class="pn">:</tspan> <tspan class="st">"Creative IT Institute"</tspan><tspan class="pn">,</tspan></text>
<text x="715" y="272" class="in" style="animation-delay:1.9s">  <tspan class="pr">currently</tspan><tspan class="pn">:</tspan> <tspan class="st">"Programming Hero B14"</tspan></text>
<text x="715" y="296" class="in" style="animation-delay:2.1s"><tspan class="pn">};</tspan><tspan class="cursor pr">_</tspan></text>
</g>
<path d="M670 300h450v8a16 16 0 0 1-16 16H686a16 16 0 0 1-16-16z" fill="#140a28" />
<circle cx="690" cy="312" r="4" fill="#34d399" />
<text class="sans" x="702" y="316" font-size="11" fill="#94a3b8">TypeScript</text>
<text class="sans" x="1100" y="316" font-size="11" fill="#94a3b8" text-anchor="end">Ln 8, Col 3</text>
</g>
<g class="in" style="animation-delay:1.8s">
<rect x="1080" y="32" width="40" height="40" rx="11" fill="#1a0f2e" stroke="#c084fc" stroke-opacity=".5" stroke-width="1.5" />
<text class="mono" x="1100" y="57" font-size="15" font-weight="700" fill="#c084fc" text-anchor="middle">&lt;/&gt;</text>
</g>
</svg>
