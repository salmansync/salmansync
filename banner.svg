<g transform="translate(10 10)"><rect x="4" y="4" width="32" height="32" rx="4" fill="#3178C6" /><text class="sans lt" x="32" y="32" fill="#fff">TS</text></g>
</g>

<g class="in" transform="translate(214 236)" style="--c:#61dafb;animation-delay:.8s">
<use href="#ib" class="cd" /><use href="#ib" class="ct" />
<g transform="translate(10 10)" fill="none" stroke="#61DAFB" stroke-width="2.2"><ellipse cx="20" cy="20" rx="14.5" ry="5.5" /><ellipse cx="20" cy="20" rx="14.5" ry="5.5" transform="rotate(60 20 20)" /><ellipse cx="20" cy="20" rx="14.5" ry="5.5" transform="rotate(120 20 20)" /><circle cx="20" cy="20" r="2.8" fill="#61DAFB" stroke="none" /></g>
</g>

<g class="in" transform="translate(286 236)" style="--c:#339933;animation-delay:.9s">
<use href="#ib" class="cd" /><use href="#ib" class="ct" />
<g transform="translate(10 10) scale(0.62) translate(0, 1)"><path fill="#339933" d="M57.6,18.3L32,3.5L6.4,18.3v29.5L32,62.5l25.6-14.8V18.3z M32,56.5L12.1,45V20.9l19.9-11.5L51.9,20.9V45L32,56.5z"/><path fill="#339933" d="M30.4,24.1c-3.1,0-5.7,1.4-7.2,3.9v-3.6h-5.4v21h5.4V34.5c0-2.4,1.4-3.6,3.6-3.6c2.4,0,3.6,1.4,3.6,3.6v10.9h5.4V33.6C35.8,27.8,33.7,24.1,30.4,24.1z"/><path fill="#339933" d="M47.7,24.4h-5.4v3.6c-1.5-2.5-4.1-3.9-7.2-3.9c-3.3,0-5.4,3.7-5.4,10.6v0c0,6.9,2.1,10.6,5.4,10.6c3.1,0,5.7-1.4,7.2-3.9v3.6h5.4V24.4z M42.3,34.5v0c0,2.4-1.4,3.6-3.6,3.6c-2.2,0-3.6-1.2-3.6-3.6V34.5c0-2.4,1.4-3.6,3.6-3.6C40.9,30.9,42.3,32.1,42.3,34.5z"/></g>
</g>

