<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="Md. Salman Farsi, Full-Stack Web Engineer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0310" /><stop offset=".5" stop-color="#190933" /><stop offset="1" stop-color="#2d134b" /></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc" /><stop offset=".5" stop-color="#818cf8" /><stop offset="1" stop-color="#38bdf8" /></linearGradient>
<linearGradient id="winBorder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c084fc" stop-opacity=".7" /><stop offset=".5" stop-color="#2d134b" stop-opacity=".9" /><stop offset="1" stop-color="#38bdf8" stop-opacity=".7" /></linearGradient>
<linearGradient id="nameGrad"><stop offset="0" stop-color="#e879f9" /><stop offset=".4" stop-color="#c084fc" /><stop offset="1" stop-color="#38bdf8" /></linearGradient>
<linearGradient id="beam"><stop offset="0" stop-color="#c084fc" stop-opacity="0" /><stop offset=".5" stop-color="#c084fc" stop-opacity=".1" /><stop offset="1" stop-color="#c084fc" stop-opacity="0" /></linearGradient>
<radialGradient id="spot"><stop offset="0" stop-color="#a855f7" stop-opacity=".2" /><stop offset="1" stop-color="#a855f7" stop-opacity="0" /></radialGradient>
<radialGradient id="orbBlue"><stop offset="0" stop-color="#e879f9" stop-opacity=".2" /><stop offset="1" stop-color="#e879f9" stop-opacity="0" /></radialGradient>
<radialGradient id="orbIndigo"><stop offset="0" stop-color="#818cf8" stop-opacity=".25" /><stop offset="1" stop-color="#818cf8" stop-opacity="0" /></radialGradient>

<!-- Floating Programming Symbols Paths -->
<path id="s-code" d="M10 8L4 14l6 6M18 8l6 6-6 6M15 6l-4 16"/>
<path id="s-brace" d="M12 4C8 4 9 8 9 11c0 2-2 3-4 3 2 0 4 1 4 3 0 3-1 7 3 7M16 4c4 0 3 4 3 7 0 2 2 3 4 3-2 0-4 1-4 3 0 3 1 7-3 7"/>
<path id="s-bracket" d="M11 4H6v20h5M17 4h5v20h-5"/>
<path id="s-slash" d="M11 22L16 6M19 22l5-16"/>

<style>
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:Consolas,'SF Mono',Menlo,'Courier New',monospace}
.eyebrow{font-size:11.5px;font-weight:700;fill:#c084fc;letter-spacing:4.5px}
.name{font-size:46px;font-weight:800;fill:url(#nameGrad);letter-spacing:.25px}
.role{font-size:18px;font-weight:700;fill:#94a3b8;letter-spacing:5.5px}
.code{font-size:14.5px;fill:#cbd5e1}
.ln{font-size:13px;fill:#64748b}
.kw{fill:#f472b6}.pr{fill:#38bdf8}.st{fill:#34d399}.pn{fill:#a78bfa}
.cd{fill:#0b0515;stroke:var(--c);stroke-opacity:.4;stroke-width:1.5}
.ct{fill:var(--c);opacity:.07}
.lt{font-size:20px;font-weight:900;text-anchor:middle}
.in{opacity:0;animation:rise .8s ease-out forwards}

/* Background Animations */
.blob1{animation:drift 12s ease-in-out infinite alternate}
.blob2{animation:drift 15s ease-in-out infinite alternate-reverse}
.wave1{animation:sway 12s ease-in-out infinite alternate}
.wave2{animation:sway 16s ease-in-out infinite alternate-reverse}
.breath{animation:breath 5s ease-in-out infinite alternate}
.cursor{animation:blink 1.2s steps(1) infinite}
.bar,.eline{transform-box:fill-box;transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}

/* Floating Symbols CSS */
.gl{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.15}
.a{stroke:#c084fc}.b{stroke:#38bdf8}
.fr,.fl,.fu{animation:flow var(--d) var(--t) linear infinite}
.fr{--x:1320px;--y:0px}.fl{--x:-1320px;--y:0px}.fu{--x:0px;--y:-860px}

/* Logo Border Animation CSS */
.icon-border {
  fill: none;
  stroke-width: 2.5px;
  animation: pulseBorder 1.8s infinite alternate ease-in-out;
}
.ib-1 { animation-delay: 0s; stroke: #F7DF1E; }
.ib-2 { animation-delay: 0.2s; stroke: #3178C6; }
.ib-3 { animation-delay: 0.4s; stroke: #61DAFB; }
.ib-4 { animation-delay: 0.6s; stroke: #FFFFFF; }
.ib-5 { animation-delay: 0.8s; stroke: #339933; }
.ib-6 { animation-delay: 1.0s; stroke: #FFD43B; }
.ib-7 { animation-delay: 1.2s; stroke: #47A248; }

@keyframes pulseBorder {
  0% { stroke-opacity: 0.1; stroke-width: 1px; }
  100% { stroke-opacity: 1; stroke-width: 3.5px; filter: drop-shadow(0 0 6px currentColor); }
}
@keyframes rise{to{opacity:1}}
@keyframes drift{from{transform:translate(-20px,0)}to{transform:translate(20px,10px)}}
@keyframes sway{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes breath{from{opacity:.45}to{opacity:.85}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{0%{transform:translate(0,0);opacity:0}8%,92%{opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
</style>
</defs>

<rect width="1200" height="400" fill="url(#bg)" />
<polygon points="260,0 360,0 140,400 40,400" fill="url(#beam)" />
<polygon points="560,0 610,0 450,400 400,400" fill="url(#beam)" />
<circle cx="890" cy="190" r="300" fill="url(#spot)" />
<circle class="blob1" cx="1020" cy="50" r="180" fill="url(#orbBlue)" />
<circle class="blob2" cx="210" cy="350" r="180" fill="url(#orbIndigo)" />
<path class="wave1" d="M-80 345C150 305 350 385 600 345S1050 305 1280 345V400H-80z" fill="#a855f7" opacity=".08" />
<path class="wave2" d="M-80 368C200 335 400 395 650 365S1000 340 1280 368V400H-80z" fill="#38bdf8" opacity=".08" />

<!-- Floating Symbols Elements -->
<g class="gl" transform="scale(1.5) translate(0, -30)">
<use href="#s-code" class="fr a" x="-50" y="40" style="--d:46s;--t:-5s"/>
<use href="#s-brace" class="fr b" x="-50" y="110" style="--d:55s;--t:-24s"/>
<use href="#s-slash" class="fr a" x="-50" y="190" style="--d:60s;--t:-41s"/>
<use href="#s-bracket" class="fl b" x="850" y="60" style="--d:50s;--t:-8s"/>
<use href="#s
